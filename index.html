<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortis Labs | Enterprise Blockchain Staking & Node Infrastructure</title>
    <style>
        /* --- STANDARD CSS RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --bg-color: #060814;
            --card-bg: #0f132a;
            --primary: #4f46e5; /* Electric Indigo */
            --secondary: #06b6d4; /* Cyber Cyan */
            --text-main: #ffffff;
            --text-muted: #64748b;
            --success: #10b981;
            --border-color: #1e293b;
            --past-node-bg: #0b0e20;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- NAVBAR --- */
        header {
            background-color: rgba(6, 8, 20, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--secondary);
        }

        .btn-portal {
            background: transparent;
            color: var(--secondary);
            border: 1px solid var(--secondary);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-portal:hover {
            background: var(--secondary);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: 100px 0 60px 0;
            text-align: center;
            position: relative;
        }

        .badge-enterprise {
            display: inline-block;
            background: rgba(79, 70, 229, 0.15);
            border: 1px solid var(--primary);
            color: #a5b4fc;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 25px;
            background: linear-gradient(to bottom, #ffffff 60%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #94a3b8;
            font-size: 16px;
            max-width: 750px;
            margin: 0 auto 45px auto;
        }

        /* --- METRICS / HIGH-LEVEL STATS --- */
        .grid-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
            padding-top: 40px;
        }

        .metric-item {
            text-align: center;
        }

        .metric-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- SECTION BASE --- */
        .section {
            padding: 70px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .section-subtitle {
            color: #94a3b8;
            font-size: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- VALIDATOR INFRASTRUCTURE STACK --- */
        .grid-nodes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .node-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .node-card:hover {
            transform: translateY(-5px);
            border-color: rgba(6, 182, 212, 0.3);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .node-name {
            font-size: 20px;
            font-weight: 700;
        }

        .status-pill {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .node-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-label {
            color: #94a3b8;
        }

        .info-value {
            font-weight: 600;
        }

        /* --- HISTORIC RECORD SECTION --- */
        .grid-past-nodes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .past-card {
            background-color: var(--past-node-bg);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .past-card:hover {
            border-color: var(--primary);
            background-color: rgba(79, 70, 229, 0.02);
        }

        .past-badge {
            display: inline-block;
            background-color: rgba(94, 100, 255, 0.1);
            color: #a5b4fc;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* --- TRUST & PARTNERSHIPS SECTION --- */
        .partnerships-bg {
            background-color: #090c1f;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 70px 0;
        }

        .partnership-content {
            max-width: 850px;
            margin: 0 auto;
        }

        .trust-paragraph {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 25px;
            text-align: justify;
            line-height: 1.8;
        }

        .trust-highlight {
            color: var(--secondary);
            font-weight: 600;
        }

        /* --- SECURITY & ARCHITECTURE --- */
        .grid-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .feature-card {
            padding: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .feature-icon {
            font-size: 32px;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .feature-card h3 {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .feature-card p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* --- FOOTER --- */
        footer {
            background-color: #03040a;
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 15px 0;
            }
            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .hero h1 {
                font-size: 28px;
            }
            .hero p {
                font-size: 14px;
            }
            .footer-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
