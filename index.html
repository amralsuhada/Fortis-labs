<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortis Labs | Next-Gen Validator Node</title>
    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: rgba(13, 17, 31, 0.6);
            --border-color: #161f38;
            --text-primary: #ffffff;
            --text-secondary: #8f9cae;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --glow: rgba(0, 242, 254, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-secondary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            height: 400px;
            background: radial-gradient(circle at top, rgba(0, 242, 254, 0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        header {
            background-color: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            border: 1px solid var(--accent-cyan);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
        }

        .logo-text {
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 16px;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-left: 24px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent-cyan);
        }

        .hero {
            text-align: center;
            padding: 80px 0 60px 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            color: var(--accent-cyan);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        h1 {
            color: var(--text-primary);
            font-size: 36px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }

        .gradient-text {
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 15px;
            color: var(--text-secondary);
            max-width: 520px;
            margin: 0 auto 36px auto;
            line-height: 1.6;
        }

        .cta-btn {
            display: inline-block;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .networks-section {
            padding-top: 20px;
            margin-bottom: 80px;
        }

        .section-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .section-header h2 {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .section-header p {
            font-size: 13px;
            color: rgba(143, 156, 174, 0.6);
            margin-top: 4px;
        }

        .network-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .network-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: border-color 0.3s ease;
        }

        .network-card:hover {
            border-color: rgba(0, 242, 254, 0.3);
        }

        .card-main {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .network-icon {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border-color);
            background-color: #090d16;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 14px;
            flex-shrink: 0;
        }

        .card-info h3 {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 700;
        }

        .card-info p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.5;
        }

        .card-status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(22, 31, 56, 0.5);
            padding-top: 12px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .status-active {
            color: #4ade80;
            background-color: rgba(74, 222, 128, 0.05);
            border: 1px solid rgba(74, 222, 128, 0.1);
        }

        .status-testnet {
            color: var(--accent-cyan);
            background-color: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.1);
        }

        .comm-rate {
            font-size: 11px;
            color: rgba(143, 156, 174, 0.6);
            font-weight: 500;
        }

        footer {
            border-top: 1px solid var(--border-color);
            background-color: rgba(5, 7, 15, 0.4);
            padding: 32px 0;
            font-size: 12px;
            color: rgba(143, 156, 174, 0.5);
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: rgba(143, 156, 174, 0.5);
            text-decoration: none;
        }

        @media (min-width: 640px) {
            .network-card {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            .card-status-row {
                border-top: none;
                padding-top: 0;
                flex-direction: column;
                align-items: flex-end;
                justify-content: center;
                gap: 4px;
            }
            .footer-content {
                flex-direction: row;
            }
            h1 {
                font-size: 44px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigasi Utama -->
    <header>
        <div class="container header-content">
            <div class="logo-area">
                <div class="logo-box">FL</div>
                <span class="logo-text">FORTIS LABS</span>
            </div>
            <nav>
                <a href="#about">About</a>
                <a href="#networks">Networks</a>
            </nav>
        </div>
    </header>

    <!-- Konten Utama Halaman -->
    <main class="container">
        
        <section id="about" class="hero">
            <div class="badge">
                <div class="badge-dot"></div> Node Infrastructure
            </div>
            <h1>
