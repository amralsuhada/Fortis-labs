<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortis Labs | Enterprise Blockchain Validator & Staking Infrastructure</title>
    <style>
        /* --- STANDARD CSS RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --bg-dark: #050714;
            --bg-card: #0f132a;
            --primary: #4f46e5; /* Electric Indigo */
            --secondary: #06b6d4; /* Cyber Cyan */
            --text-main: #ffffff;
            --text-muted: #64748b;
            --success: #10b981;
            --border-color: #1e293b;
            --bg-track: #090b18;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- NAVBAR --- */
        header {
            background-color: rgba(5, 7, 20, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--secondary);
        }

        .btn-portal {
            background: transparent;
            color: var(--secondary);
            border: 1px solid var(--secondary);
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-portal:hover {
            background: var(--secondary);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: 120px 0 80px 0;
            text-align: center;
            position: relative;
        }

        .badge-enterprise {
            display: inline-block;
            background: rgba(79, 70, 229, 0.15);
            border: 1px solid var(--primary);
            color: #a5b4fc;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 25px;
            background: linear-gradient(to bottom, #ffffff 60%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #94a3b8;
            font-size: 18px;
            max-width: 750px;
            margin: 0 auto 50px auto;
        }

        /* --- LARGE SCALE METRICS --- */
        .grid-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
            padding-top: 40px;
        }

        .metric-item {
            text-align: center;
        }

        .metric-title {
            font-size: 38px;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- SECTION BASE --- */
        .section {
            padding: 80px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .section-subtitle {
            color: #94a3b8;
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- ACTIVE NODES INFRASTRUCTURE --- */
        .grid-nodes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .node-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 30px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .node-card:hover {
            transform: translateY(-5px);
            border-color: rgba(6, 182, 212, 0.3);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .node-name {
            font-size: 22px;
            font-weight: 700;
        }

        .status-pill {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .node-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .info-label {
            color: #94a3b8;
        }

        .info-value {
            font-weight: 600;
        }

        /* --- ECOSYSTEM TRACK RECORD SECTION --- */
        .track-section {
            background-color: var(--bg-track);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .grid-track {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .track-card {
            background-color: rgba(5, 7, 20, 0.5);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .track-card:hover {
            border-color: var(--primary);
            background-color: rgba(79, 70, 229, 0.03);
        }

        .track-badge {
            display: inline-block;
            background-color: rgba(6, 182, 212, 0.1);
            color: var(--secondary);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- SECURITY ARCHITECTURE --- */
        .grid-security {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .security-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 14px;
        }

        .security-icon {
            font-size: 32px;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .security-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .security-card p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* --- FOOTER --- */
        footer {
            background-color: #020308;
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 20px;
            }
            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .hero h1 {
                font-size: 36px;
            }
            .footer-content {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <div class="container navbar">
            <a href="#" class="logo">Fortis Labs</a>
            <ul class="nav-links">
                <li><a href="#infrastructure">Active Infrastructure</a></li>
                <li><a href="#track-record">Ecosystem Track Record</a></li>
                <li><a href="#security">Security Stack</a></li>
            </ul>
            <button class="btn-portal" onclick="portalAlert()">Staker Portal</button>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="container hero">
