<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortis Labs | Reliable Validation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- Plus Jakarta Sans Font (Mirip dengan font di gambar) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#F8F9FE] text-[#111638] antialiased">

    <!-- Header / Navbar -->
    <header class="bg-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex flex-col justify-center">
            <!-- Brand Logo Row -->
            <div class="flex items-center gap-3 mb-3">
                <!-- Custom Logo Icon matching "coruz" style -->
                <div class="flex flex-col justify-between w-6 h-5 border-3 border-[#111638] rounded-[4px] p-[2px] relative">
                    <div class="w-2 h-[3px] bg-[#635BFF] rounded-full absolute top-[5px] left-[2px]"></div>
                </div>
                <span class="text-2xl font-extrabold tracking-tight text-[#111638]">fortis</span>
            </div>
            
            <!-- Navigation Links Row -->
            <nav class="flex items-center gap-6 text-base font-semibold text-[#111638]/80">
                <a href="#about" class="hover:text-[#111638] transition">About</a>
                <a href="#networks" class="hover:text-[#111638] transition">Networks</a>
                <a href="#contact" class="hover:text-[#111638] transition">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Hero Section -->
    <main class="max-w-xl mx-auto px-6 pt-24 pb-20 text-center flex flex-col items-center">
        
        <!-- Small Subtitle -->
        <span class="text-xs font-bold tracking-[0.25em] text-[#635BFF] uppercase mb-6 block">
            Validator
        </span>
        
        <!-- Main Heading -->
        <h1 class="text-[40px] leading-[1.15] font-extrabold tracking-tight text-[#111638] mb-8">
            Reliable validation,<br>quietly done.
        </h1>
        
        <!-- Description Paragraph -->
        <p class="text-lg leading-relaxed text-[#5C6484] font-medium max-w-md mb-12">
            fortis runs secure, always-on validator infrastructure so the stake you delegate keeps working while you stay in control.
        </p>
        
        <!-- CTA Button -->
        <button class="w-full max-w-xs bg-[#635BFF] hover:bg-[#5249E0] text-white font-semibold text-base py-4 px-8 rounded-full transition-colors duration-200 shadow-md shadow-[#635BFF]/10 cursor-pointer">
            Delegate with fortis
        </button>
        
    </main>

</body>
</html>
